name: D213 minimal firmware (ELF, FIT, IMG)
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'
      - name: Install pinned uv
        run: python -m pip install uv==0.13.6
      - name: Install locked Python dependencies
        run: uv sync --frozen
      - name: Unit tests
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Build and verify complete firmware with locked dependencies
        run: uv run --frozen python tools/build.py --profile minimal --mode full
      - name: Verify generated artifacts and reject malformed images
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Stage verified firmware and license notices
        run: uv run --frozen python tools/stage_artifacts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d213-minimal-${{ github.sha }}
          path: out/release/*
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified firmware artifacts
        run: gh run download "$GITHUB_RUN_ID" --name "d213-minimal-$GITHUB_SHA" --dir dist
      - name: Publish complete minimal firmware release
        run: |
          cat > notes.txt <<'EOF'
          Complete minimal RT-Thread firmware for ArtInChip D213ECV-DEMO-V4-0:
          ELF, BIN, FIT/ITB and ArtInChip SPI NAND IMG, plus manifest, SHA256SUMS
          and third-party license notices.

          Target: C906 RV64GC/lp64d, 128 MiB DDR3, 128 MiB SPI NAND, UART0 115200.
          Bootloader/PBP and toolchain are pinned by source revision and SHA256.
          Offline ELF/FIT/BROM/IMG structure, address, partition and CRC checks pass.
          Hardware startup, UART operation and reset recovery have not been tested.
          Read README.md before flashing; preserve a recovery path and flash backup.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME — D213 minimal firmware" --notes-file notes.txt
