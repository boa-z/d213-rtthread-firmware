name: Minimal ELF and FIT (public)
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.8'
      - name: Install pinned uv
        run: python -m pip install uv==0.13.6
      - name: Install locked Python dependencies
        run: uv sync --frozen
      - name: Unit tests
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Build ELF and FIT with locked toolchain
        run: uv run --frozen python tools/build.py --profile minimal --mode public
      - name: Verify generated artifacts and reject malformed images
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Stage public artifacts only
        run: uv run --frozen python tools/stage_public.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d213-minimal-public-${{ github.sha }}
          path: out/public/*
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified public artifacts
        run: gh run download "$GITHUB_RUN_ID" --name "d213-minimal-public-$GITHUB_SHA" --dir dist
      - name: Publish public ELF and FIT release
        run: |
          cat > notes.txt <<'EOF'
          D213 minimal RT-Thread: ELF + FIT only. Hardware boot has not been tested.

          This release does not contain a flashable full ArtInChip IMG. Bootloader/PBP
          redistribution rights remain unconfirmed. Complete images can be built
          locally with authorized resources and the hashes in deps.lock.json.
          See README.md and docs/THIRD_PARTY.md for build and license details.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME — public ELF + FIT" --notes-file notes.txt
